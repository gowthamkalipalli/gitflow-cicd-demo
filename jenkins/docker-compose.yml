services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # lab setup: lets Jenkins use the Docker socket without permission issues
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
